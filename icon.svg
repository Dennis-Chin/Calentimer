<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Focus Ring Track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="20"/>

  <!-- Glowing Progress Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="20"
          stroke-dasharray="1130" stroke-dashoffset="300" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Rotating Green Bead -->
  <circle cx="256" cy="76" r="18" fill="#ffffff" stroke="#10b981" stroke-width="6" filter="url(#glow)"/>

  <!-- Center Timer Symbol -->
  <circle cx="256" cy="256" r="22" fill="#10b981"/>
  <line x1="256" y1="256" x2="256" y2="160" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
</svg>
