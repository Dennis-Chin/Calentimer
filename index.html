<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hard-Stop Study Timer</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header: Hard Stop & Status -->
    <header class="app-header">
      <div class="header-left">
        <span class="app-brand">Calentimer</span>
        <button class="btn-notif-pill" id="btnNotifToggle" title="Enable Android notifications">
          <span class="notif-icon">🔔</span>
          <span class="notif-text" id="notifStatusText">Alerts</span>
        </button>
      </div>
      <div class="hard-stop-pill" id="hardStopPill">
        <span class="pill-label">HARD STOP</span>
        <input type="time" id="hardStopInput" class="hard-stop-input" value="15:00">
      </div>
    </header>

    <!-- Schedule Status Pill -->
    <div class="status-banner" id="statusBanner">
      <span class="status-indicator"></span>
      <span id="statusText">All tasks fit on schedule</span>
    </div>

    <!-- Main Focus Timer Hero Section -->
    <main class="timer-viewport">
      <div class="wheel-container" id="wheelContainer">
        <!-- SVG Rotary Dial & Revolving Orbit -->
        <svg class="rotary-svg" viewBox="0 0 320 320" id="rotarySvg">
          <!-- Outer Rotatable Dial Bezel with notches (Visibly turns when dragged) -->
          <g id="rotaryDialGroup" class="rotary-dial-group">
            <!-- Invisible wide touch hitbox ring for easy and reliable grabbing -->
            <circle class="dial-hit-ring" id="dialHitRing" cx="160" cy="160" r="145" stroke="transparent" stroke-width="45" fill="none" pointer-events="stroke" cursor="grab" />
            <circle class="bezel-rim" cx="160" cy="160" r="150" />
            <!-- Dial tick notches generated dynamically -->
            <g id="dialTicksGroup" class="dial-ticks-group"></g>
          </g>

          <!-- Stationary Progress Track -->
          <circle class="track-bg" cx="160" cy="160" r="130" />
          <!-- Animated Progress track starting from top (12 o'clock) -->
          <circle class="track-progress" id="trackProgress" cx="160" cy="160" r="130" transform="rotate(-90 160 160)" />

          <!-- The Revolving Circle Handle: Click and drag this moving part to scrub time back and forth in 1-second increments! -->
          <g id="revolvingCircleGroup" class="revolving-circle-group" cursor="grab">
            <circle class="revolving-hitbox" id="revolvingHitbox" cx="160" cy="30" r="24" fill="transparent" pointer-events="all" />
            <circle class="revolving-glow" id="revolvingGlow" cx="160" cy="30" r="14" />
            <circle class="revolving-circle" id="revolvingCircle" cx="160" cy="30" r="8" />
          </g>
        </svg>

        <!-- Center Display: Digital Clock + Tags -->
        <div class="timer-center-display">
          <div class="task-category-chip" id="activeCategoryChip">STUDY</div>
          <div class="digital-clock" id="digitalClock">25:00</div>
          <div class="active-task-title" id="activeTaskTitle">Core Reading & Notes</div>
          
          <!-- Tags describing the task -->
          <div class="task-tags-container" id="taskTagsContainer">
            <span class="task-tag">#focus</span>
            <span class="task-tag">#reading</span>
          </div>

          <!-- Rotary Wheel Adjustment Preview / Prompt -->
          <div class="rotary-preview-badge hidden" id="rotaryPreviewBadge">+0m</div>
        </div>
      </div>

      <!-- Rotary Confirmation Modal/Pill -->
      <div class="rotary-confirm-pill hidden" id="rotaryConfirmPill">
        <span id="rotaryConfirmText">Adjust time by +5m?</span>
        <div class="confirm-actions">
          <button class="btn-confirm-yes" id="btnConfirmAdjust">Apply</button>
          <button class="btn-confirm-no" id="btnCancelAdjust">Cancel</button>
        </div>
      </div>

      <!-- Warning Overflow Banner (If locked tasks exceed Hard Stop) -->
      <div class="warning-alert-card hidden" id="warningAlertCard">
        <div class="warning-title">⚠️ Hard Stop Exceeded</div>
        <div class="warning-desc" id="warningDesc">Locked tasks exceed the available window.</div>
      </div>

      <!-- Primary Control Buttons (Below Wheel) -->
      <div class="timer-controls">
        <!-- Left: Reset Day / Exit Task Button -->
        <button class="control-btn btn-secondary" id="btnStopTime" title="Reset all events for the day">
          <span id="stopTimeIcon" style="display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </span>
          <span class="btn-label" id="stopTimeLabel">Reset</span>
        </button>

        <!-- Middle: Play / Pause -->
        <button class="control-btn btn-primary" id="btnPlayPause" title="Start or Pause">
          <svg class="icon-play" id="iconPlay" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="icon-pause hidden" id="iconPause" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Right: Skip Task -->
        <button class="control-btn btn-secondary" id="btnSkipTask" title="Skip to Next Task">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
          <span class="btn-label">Skip</span>
        </button>
      </div>

      <!-- Intuitive Time Reclaim Action -->
      <div class="secondary-actions">
        <button class="btn-finish-early" id="btnFinishEarly" title="Mark this task finished now and share remaining minutes with subsequent tasks">
          <span class="finish-early-icon">⚡</span>
          <span class="finish-early-text" id="finishEarlyText">Finish Early & Share Time With Rest of Schedule</span>
        </button>
      </div>
    </main>

    <!-- Bottom Task Pipeline & Drawer -->
    <section class="task-drawer" id="taskDrawer">
      <div class="drawer-header" id="drawerHeader">
        <div class="drawer-header-left">
          <span class="drawer-title">Study Pipeline</span>
          <span class="task-count-badge" id="taskCountBadge">3 tasks</span>
        </div>
        <button class="btn-drawer-toggle" id="btnDrawerToggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <div class="drawer-content" id="drawerContent">
        <!-- Add Task Form -->
        <form class="add-task-form" id="addTaskForm">
          <input type="text" id="inputTaskTitle" placeholder="Task or meeting title..." required class="input-task-title">
          <div class="form-grid-row">
            <div class="input-field-wrapper">
              <label class="field-label">DURATION</label>
              <div class="input-group">
                <input type="number" id="inputTaskDuration" placeholder="25" min="1" max="480" value="25" required class="input-task-min">
                <span class="input-suffix">m</span>
              </div>
            </div>
            <div class="input-field-wrapper">
              <label class="field-label">CATEGORY</label>
              <input type="text" id="inputTaskCategory" placeholder="Study, Work" class="input-task-cat">
            </div>
            <div class="input-field-wrapper">
              <label class="field-label">FIXED TIME</label>
              <input type="time" id="inputTaskFixedTime" title="Fixed start time (locks task at exact time, e.g. 15:00)" class="input-task-fixed">
            </div>
          </div>
          <div class="form-bottom-row">
            <input type="text" id="inputTaskTags" placeholder="Tags (e.g. exam, urgent)" class="input-task-tags">
            <button type="submit" class="btn-add-task">+ Add Task</button>
          </div>
        </form>

        <!-- Tasks Schedule List -->
        <div class="task-list" id="taskListContainer">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
