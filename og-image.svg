<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="30%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#142022"/>
      <stop offset="45%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 255, 136, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.12)"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Rotary Dial Graphic on Right -->
  <g transform="translate(860, 315)">
    <!-- Outer Bezel Ring -->
    <circle cx="0" cy="0" r="220" fill="#0d1119" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>
    
    <!-- Outer Tick Notches -->
    <g opacity="0.45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-214" x2="0" y2="-196" stroke="#00ff88" stroke-width="4"/>
      <line x1="151" y1="-151" x2="139" y2="-139"/>
      <line x1="214" y1="0" x2="196" y2="0" stroke="#00f0ff" stroke-width="4"/>
      <line x1="151" y1="151" x2="139" y2="139"/>
      <line x1="0" y1="214" x2="0" y2="196" stroke="#00ff88" stroke-width="4"/>
      <line x1="-151" y1="151" x2="-139" y2="139"/>
      <line x1="-214" y1="0" x2="-196" y2="0" stroke="#00f0ff" stroke-width="4"/>
      <line x1="-151" y1="-151" x2="-139" y2="-139"/>
    </g>

    <!-- Track Background -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="26"/>
    
    <!-- Glowing Progress Track -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="26"
            stroke-dasharray="1068" stroke-dashoffset="340" stroke-linecap="round" filter="url(#glowEffect)"/>

    <!-- Revolving Glow Handle -->
    <circle cx="120" cy="-120" r="18" fill="#ffffff" stroke="#00ff88" stroke-width="6" filter="url(#glowEffect)"/>

    <!-- Inner Dial Face -->
    <circle cx="0" cy="0" r="130" fill="#0c0e14" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2"/>
    
    <!-- Digital Clock Display -->
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">25:00</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">DEEP WORK</text>
    <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">14:00 → 14:25</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge: Hard Stop Protocol -->
    <rect x="0" y="0" width="240" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1.5"/>
    <text x="120" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1">⚡ HARD-STOP PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="800" fill="url(#brandGrad)" letter-spacing="-2">Calentimer</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      The Hard-Stop Focus Timer &amp; Schedule Planner
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#94a3b8" line-height="1.5">
      <tspan x="0" dy="0">Tasks automatically compress to fit your finish deadline.</tspan>
      <tspan x="0" dy="32">Interactive rotary wheel, time-bank protection &amp; full calendar sync.</tspan>
    </text>

    <!-- Feature Chips Row -->
    <g transform="translate(0, 310)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="180" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="90" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">⏱️ Time Compression</text>

      <!-- Chip 2 -->
      <rect x="195" y="0" width="170" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="280" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">🐷 Time Banking</text>

      <!-- Chip 3 -->
      <rect x="380" y="0" width="165" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="462" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">📅 Calendar Sync</text>
    </g>

    <!-- Web Domain Footer -->
    <g transform="translate(0, 395)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#00f0ff" letter-spacing="0.5">https://calentimer.com</text>
    </g>
  </g>
</svg>
